[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saara"
version = "0.1.0"
description = "Saara: local-first CLI for dataset generation, labeling, validation, and distillation workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Saara Contributors" }]
keywords = ["cli", "datasets", "llm", "local-first", "distillation", "labeling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/saara-ai/saara"
Documentation = "https://github.com/saara-ai/saara/tree/main/docs"
Issues = "https://github.com/saara-ai/saara/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.5", "setuptools>=68", "twine>=5.0", "wheel"]
rich = ["rich>=13.7"]
data = ["pyarrow>=15.0", "datasets>=2.19"]
pdf = ["pymupdf>=1.24", "pypdf>=4.0"]
agents = ["langchain-core>=0.3"]
all = [
  "rich>=13.7",
  "pyarrow>=15.0",
  "datasets>=2.19",
  "pymupdf>=1.24",
  "pypdf>=4.0",
  "langchain-core>=0.3",
]

[project.scripts]
saara = "mlforge.cli:main"
mlforge = "mlforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-p", "no:launch_testing", "-p", "no:launch_testing_ros"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
